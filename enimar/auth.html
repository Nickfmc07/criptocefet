<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall de Acesso - EniMaR</title>
    <style>
        :root {
            --term-green: #39ff14;
            --term-red: #ff0033;
            --term-bg: #050505;
            --term-glow: 0 0 10px rgba(57, 255, 20, 0.4);
            --term-glow-red: 0 0 15px rgba(255, 0, 51, 0.6);
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 0.3s ease;
        }

        /* Efeito de linhas de monitor CRT */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            z-index: 10;
        }

        .auth-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 30px;
            position: relative;
        }

        /* Estilização do Input estilo senha */
        input[type="text"] {
            width: 80%;
            background: transparent;
            border: 2px solid var(--term-green);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            padding: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 8px;
            outline: none;
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6), inset 0 0 10px rgba(57, 255, 20, 0.4);
        }

        /* Animação de erro (shake) */
        .error-shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
            border-color: var(--term-red) !important;
            color: var(--term-red) !important;
            box-shadow: var(--term-glow-red) !important;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-8px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(8px, 0, 0);
            }
        }

        .btn {
            background: rgba(57, 255, 20, 0.1);
            color: var(--term-green);
            border: 2px solid var(--term-green);
            padding: 15px 40px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            box-shadow: var(--term-glow);
        }

        .btn:hover {
            background: var(--term-green);
            color: var(--term-bg);
        }

        .status-message {
            margin-top: 30px;
            font-size: 1.2rem;
            height: 1.5em;
            /* Mantém o espaço mesmo vazio */
            font-weight: bold;
            letter-spacing: 2px;
        }

        .text-red {
            color: var(--term-red);
        }

        .text-green {
            color: var(--term-green);
        }

        @keyframes pulse {
            0% {
                text-shadow: var(--term-glow);
            }

            50% {
                text-shadow: 0 0 20px rgba(57, 255, 20, 0.8);
            }

            100% {
                text-shadow: var(--term-glow);
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="lock-icon" id="lock-icon">🔒</div>
        <h1>Acesso Restrito - Nível 1</h1>

        <div class="input-group">
            <input type="text" id="passcode" placeholder="CÓDIGO" autocomplete="off" spellcheck="false">
        </div>

        <button class="btn" onclick="checkPassword()">Verificar</button>

        <div class="status-message" id="status-msg">_</div>
    </div>

    <script>
        const expectedPasswords = [
            "TRANSMISSAOCONFIRMADA",
            "IPDOSERVIDOR",
            "113"
        ];

        function checkPassword() {
            const inputField = document.getElementById('passcode');
            const statusMsg = document.getElementById('status-msg');
            const lockIcon = document.getElementById('lock-icon');

            const userAttempt = inputField.value.replace(/\s+/g, '').toUpperCase();
            const passwordIndex = expectedPasswords.indexOf(userAttempt);

            if (passwordIndex !== -1) {
                inputField.style.borderColor = "var(--term-green)";
                lockIcon.innerText = "🔓";
                document.body.style.backgroundColor = "rgba(0, 30, 0, 1)";
                statusMsg.innerHTML = "[ ACESSO AUTORIZADO: FIREWALL DESATIVADO ]";
                statusMsg.className = "status-message text-green";

                setTimeout(() => {
                    alert(`Avançando para o Nível ${(passwordIndex + 2)}...`);
                    window.location.href = `historia ${(passwordIndex + 2)}.html`;
                }, 2000);

            } else {
                inputField.classList.remove('error-shake');
                void inputField.offsetWidth;
                inputField.classList.add('error-shake');
                lockIcon.innerText = "🔒";
                statusMsg.innerHTML = "[ ACESSO NEGADO: CHAVE INCORRETA ]";
                statusMsg.className = "status-message text-red";

                setTimeout(() => {
                    inputField.value = "";
                }, 800);
            }
        }

        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>

</html>
